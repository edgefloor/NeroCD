name: Agent policy

on:
  push:
    branches:
      - "**"
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".dockerignore"
      - ".gitignore"
      - ".github/workflows/agent-policy.yml"
      - "agent/**"
      - "docs/agent/**"
      - "docs/AGENT-ORCHESTRATION.md"
      - "docs/AGENT-ORCHESTRATION-NATIVE.md"
      - "docs/NATIVE-ROLLOUT.md"
      - "docs/ORCHESTRATION-BENCHMARK.md"
      - "docs/SKILL-AUDIT.md"
      - "orchestration/**"
      - "scripts/orchestration/**"
      - "scripts/skills/**"
      - "skills-lock.json"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".dockerignore"
      - ".gitignore"
      - ".github/workflows/agent-policy.yml"
      - "agent/**"
      - "docs/agent/**"
      - "docs/AGENT-ORCHESTRATION.md"
      - "docs/AGENT-ORCHESTRATION-NATIVE.md"
      - "docs/NATIVE-ROLLOUT.md"
      - "docs/ORCHESTRATION-BENCHMARK.md"
      - "docs/SKILL-AUDIT.md"
      - "orchestration/**"
      - "scripts/orchestration/**"
      - "scripts/skills/**"
      - "skills-lock.json"
      - "Makefile"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Validate orchestration protocol
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s orchestration -p 'test_*.py'
          python3 scripts/orchestration/validate.py --repo-root . config
          python3 scripts/orchestration/validate.py packet orchestration/examples/worker-packet.json

      - name: Validate native orchestration checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest scripts/orchestration/test_native_check.py

      - name: Set up Go for skill analyzers
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate skill tools and canonical inventory
        run: make skill-tools-test

      - name: Validate policy hooks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .codex/hooks -p 'test_*.py'
