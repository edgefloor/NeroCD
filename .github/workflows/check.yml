name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: nerocd
          POSTGRES_PASSWORD: nerocd_dev
          POSTGRES_DB: nerocd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerocd -d nerocd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Select lint baseline
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "LINT_BASE_REV=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "LINT_BASE_REV=HEAD^" >> "$GITHUB_ENV"
          else
            echo "LINT_BASE_REV=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Run checks
        run: make check

      - name: Run PostgreSQL integration tests
        run: make postgres-test
        env:
          NEROCD_TEST_DATABASE_URL: postgres://nerocd:nerocd_dev@127.0.0.1:5432/nerocd?sslmode=disable

      - name: Install browser dependencies
        run: cd web/app && bunx playwright install --with-deps chromium

      - name: Run browser smoke
        run: make browser-smoke

      - name: Generate release artifacts
        run: make release-artifacts

      - name: Upload SBOM and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-artifacts
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: false
