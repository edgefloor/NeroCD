# Adapted from Coolify b12d1386f3d458618b4c579babcd1e339c6c40b3:
# templates/compose/wordpress-with-mysql.yaml. Pin both official image versions
# and wait for the upstream MySQL health check before starting WordPress.
services:
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:f6056dcd9e4c146cc9f150b99b1ec62d875712a66dcab4005042778b0310e834
    volumes:
      - wordpress-files:/var/www/html
    environment:
      - SERVICE_URL_WORDPRESS
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=${SERVICE_USER_WORDPRESS:?Supply a managed MySQL username reference}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_WORDPRESS:?Supply a managed MySQL password reference}
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
  mysql:
    image: mysql:8.4.13-oraclelinux9@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT:?Supply a separate managed MySQL root password reference}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=${SERVICE_USER_WORDPRESS:?Supply a managed MySQL username reference}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_WORDPRESS:?Supply a managed MySQL password reference}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  wordpress-files: {}
  mysql-data: {}
