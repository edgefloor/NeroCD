type_system: database/sql
tags:
  - json
no_back_referencing: true
generator: NeroCD BobGen

plugins_preset: all
plugins:
  dbinfo:
    destination: internal/store/bobgen/dbinfo
    pkgname: dbinfo
  enums:
    destination: internal/store/bobgen/enums
    pkgname: enums
  models:
    destination: internal/store/bobgen/models
    pkgname: models
  factory:
    destination: internal/store/bobgen/factory
    pkgname: factory
  dberrors:
    destination: internal/store/bobgen/dberrors
    pkgname: dberrors

psql:
  driver: github.com/jackc/pgx/v5/stdlib
  schemas:
    - public
  queries:
    - internal/store/bobgen/queries
  except:
    schema_migrations:
