services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nerocd
      POSTGRES_USER: nerocd
      POSTGRES_PASSWORD: nerocd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerocd -d nerocd"]
      interval: 5s
      timeout: 3s
      retries: 10

  nerocd:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEROCD_DATABASE_URL: postgres://nerocd:nerocd_dev@postgres:5432/nerocd?sslmode=disable
    ports:
      - "8080:8080"
    entrypoint: ["sh", "-c"]
    command: ["nerocd migrate --seed=true && exec nerocd server --addr :8080"]

volumes:
  postgres-data:
