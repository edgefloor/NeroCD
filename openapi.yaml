        - {name: code, in: query, required: false, schema: {type: string, maxLength: 2048}, description: Required unless the provider returned an OAuth error.}
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 2048}}
        - {name: error, in: query, required: false, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}, description: Provider denial code; never reflected to the browser or audit.}
        - {name: error_description, in: query, required: false, schema: {type: string}, description: Ignored provider detail.}
        - {name: iss, in: query, required: false, schema: {type: string, maxLength: 2048}, description: "RFC 9207 issuer, checked exactly against the configured issuer when present."}
        - {name: session_state, in: query, required: false, schema: {type: string}, description: Provider session hint ignored by NeroCD.}
      responses:
        "302":
          description: Establish the existing browser session and redirect to the validated application path, or return a generic bound-flow failure to sign-in.
