          },
          "version": {
            "type": "string",
            "enum": [
              "postgresql.logical-s3-transfer.v1"
            ]
          },
          "project_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
          },
          "target_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
          },
