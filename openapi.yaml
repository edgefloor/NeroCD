      type: object
      additionalProperties: false
      required: [version, phase, receipt_id, state_hash, previous_state_hash, stage_hash, candidate_hash, recovery_actions, recovery_action, recovery_state]
      description: Safe durable correlation and explicit recovery offers. Recovery state is independent of the original operation result. Only succeeded records verified recovery settlement; uncertainty retains ownership. No field grants runner authority.
      properties:
        version: {type: string, enum: [application-database.storage.v1]}
        phase: {type: string, enum: [stop_intent, stopped, candidate_stopped, replacement_failed, resume_intent, resumed]}
        receipt_id: {$ref: "#/components/schemas/HostingIdentifier"}
