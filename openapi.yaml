openapi: 3.1.0
info:
  title: NeroCD API
  version: 0.1.0
  description: |
    Public REST API for the NeroCD automation control plane.

    All public routes are versioned under `/api/v1`. List responses use a stable
    `{ "items": [...] }` envelope. Error responses use
    `{ "code": "stable_code", "error": "message" }`.

    List endpoints return a stable `{ "items": [...] }` envelope plus
    pagination metadata: `limit`, `offset`, `count`, and `total`. Clients can
    request `limit` and `offset` query parameters. Filtering is documented per
    endpoint. Mutations consume JSON request bodies and return the created
    resource or validation errors.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
security:
  - bearerAuth: []
  - browserSession: []
paths:
  /api/v1/services:
    get:
      summary: List deployment services
      operationId: listServices
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": {description: Services, content: {application/json: {schema: {$ref: "#/components/schemas/ServiceListResponse"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: Create a deployment service
      operationId: createService
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ServiceInput"}}}}
      responses:
        "201": {description: Service created, content: {application/json: {schema: {$ref: "#/components/schemas/Service"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/environments:
    get:
      summary: List deployment environments
      operationId: listEnvironments
      parameters:
        - name: service_id
          in: query
          schema: {type: string}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": {description: Environments, content: {application/json: {schema: {$ref: "#/components/schemas/EnvironmentListResponse"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: Create a deployment environment
      operationId: createEnvironment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EnvironmentInput"}}}}
      responses:
        "201": {description: Environment created, content: {application/json: {schema: {$ref: "#/components/schemas/Environment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/revisions:
    get:
      summary: List immutable revisions
      operationId: listRevisions
      parameters:
        - name: service_id
          in: query
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": {description: Revisions, content: {application/json: {schema: {$ref: "#/components/schemas/RevisionListResponse"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: Create an immutable revision
      operationId: createRevision
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RevisionInput"}}}}
      responses:
        "201": {description: Revision created, content: {application/json: {schema: {$ref: "#/components/schemas/Revision"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments:
    get:
      summary: List deployments
      operationId: listDeployments
      parameters:
        - name: environment_id
          in: query
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": {description: Deployments, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentListResponse"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: Request a deployment
      operationId: createDeployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentInput"}}}}
      responses:
        "201": {description: Deployment created, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/{id}:
    get:
      summary: Get one deployment visible to the authenticated project viewer
      operationId: getDeployment
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Deployment, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/cancel:
    post:
      summary: Cancel a deployment through its typed environment lifecycle
      operationId: cancelDeployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentCancelInput"}}}}
      responses:
        "200": {description: Cancellation receipt acknowledged, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/runners/deployments/transition:
    post:
      summary: Apply one fenced deployment state transition
      operationId: transitionRunnerDeployment
      security:
        - bearerAuth: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentTransitionInput"}}}}
      responses:
        "200": {description: Transition acknowledged, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/runners/deployments/plan:
    get:
      summary: Read the exact fenced deployment plan for the authenticated runner
      operationId: runnerDeploymentPlan
      security: [{bearerAuth: []}]
      parameters:
        - {name: deployment_id, in: query, required: true, schema: {type: string}}
        - {name: run_id, in: query, required: true, schema: {type: string}}
        - {name: lease_id, in: query, required: true, schema: {type: string}}
        - {name: attempt, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: fence, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Fenced plan, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentPlan"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/runners/deployments/status:
    get:
      summary: Read the exact fenced deployment status and cancellation receipt for the authenticated runner
      operationId: runnerDeploymentStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: deployment_id, in: query, required: true, schema: {type: string}}
        - {name: run_id, in: query, required: true, schema: {type: string}}
        - {name: lease_id, in: query, required: true, schema: {type: string}}
        - {name: attempt, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: fence, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Fenced authoritative status, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentPlan"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/runners/deployments/provenance:
    post:
      summary: Bind runner-observed immutable deployment provenance
      operationId: resolveRunnerDeploymentProvenance
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProvenanceResolutionInput"}}}}
      responses:
        "200": {description: Provenance acknowledged, content: {application/json: {schema: {$ref: "#/components/schemas/Revision"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/runners/deployments/fail-and-rollback:
    post:
      summary: Atomically fail a fenced post-apply deployment and queue its rollback
      operationId: failRunnerDeploymentAndQueueRollback
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentFailureRollbackInput"}}}}
      responses:
        "200": {description: Failure and rollback acknowledged, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentFailureRollbackResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/confirm:
    post:
      summary: Confirm a deployment request and queue its typed run
      operationId: confirmDeployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentConfirmationInput"}}}}
      responses:
        "200": {description: Deployment confirmed, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/fail-preassignment:
    post:
      summary: Record a maintainer validation failure before runner assignment
      operationId: failPreAssignmentDeployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PreAssignmentFailureInput"}}}}
      responses:
        "200": {description: Deployment failed before assignment, content: {application/json: {schema: {$ref: "#/components/schemas/Deployment"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/health:
    get:
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/ready:
    get:
      summary: Check API readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: API dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/bootstrap-status:
    get:
      summary: Get minimal local identity bootstrap state
      operationId: getBootstrapStatus
      security: []
      responses:
        "200": {description: Fixed bootstrap lifecycle state, content: {application/json: {schema: {$ref: "#/components/schemas/BootstrapStatus"}}}}
        "503": {description: Bootstrap state is temporarily unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/OperationsUnavailable"}}}}
  /api/v1/oidc/status:
    get:
      summary: Get minimal enterprise OIDC availability
      operationId: getOIDCStatus
      security: []
      responses:
        "200": {description: OIDC availability without provider configuration detail, content: {application/json: {schema: {$ref: "#/components/schemas/OIDCStatus"}}}}
  /api/v1/oidc/login:
    get:
      summary: Begin an enterprise OIDC browser sign-in
      operationId: beginOIDCLogin
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          schema: {type: string, maxLength: 500}
          description: Strict application-relative return path.
      responses:
        "302":
          description: Redirect to the fixed configured provider authorization endpoint.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {schema: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/oidc/callback:
    get:
      summary: Complete an enterprise OIDC browser sign-in
      operationId: completeOIDCLogin
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string, maxLength: 2048}, description: Required unless the provider returned an OAuth error.}
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 2048}}
        - {name: error, in: query, required: false, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}, description: Provider denial code; never reflected to the browser or audit.}
        - {name: error_description, in: query, required: false, schema: {type: string}, description: Ignored provider detail.}
        - {name: iss, in: query, required: false, schema: {type: string, maxLength: 2048}, description: "RFC 9207 issuer, checked exactly against the configured issuer when present."}
        - {name: session_state, in: query, required: false, schema: {type: string}, description: Provider session hint ignored by NeroCD.}
      responses:
        "302":
          description: Establish the existing browser session and redirect to the validated application path, or return a generic bound-flow failure to sign-in.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {schema: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/operations/status:
    get:
      summary: Get authoritative administrative operations status
      operationId: getOperationsStatus
      responses:
        "200": {description: Ready administrative operational snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/OperationsStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {description: Operations state unavailable; no partial snapshot is returned., content: {application/json: {schema: {$ref: "#/components/schemas/OperationsUnavailable"}}}}
  /api/v1/run-log-retention:
    get:
      summary: Get the global manual run-log retention policy and aggregate preview
      operationId: getRunLogRetentionStatus
      responses:
        "200": {description: Current policy and aggregate-only preview, content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionStatus"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    put:
      summary: Update the global manual run-log retention policy
      operationId: updateRunLogRetentionPolicy
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionPolicyInput"}}}
      responses:
        "200": {description: Updated policy and aggregate-only preview, content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionStatus"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/run-log-retention/preview:
    post:
      summary: Preview the current global run-log retention policy
      operationId: previewRunLogRetention
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        "200": {description: Aggregate-only retention preview, content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/run-log-retention/execute:
    post:
      summary: Execute one bounded, idempotent manual run-log retention batch
      operationId: executeRunLogRetention
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionExecuteInput"}}}
      responses:
        "200": {description: Immutable execution receipt with aggregate-only result, content: {application/json: {schema: {$ref: "#/components/schemas/RunLogRetentionExecution"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/me:
    get:
      summary: Get the current principal
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Current authenticated or bootstrap principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/runners/events/batch:
    post:
      summary: Append an idempotent bounded batch of attempt events
      operationId: appendRunnerEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEventBatchInput"
      responses:
        "200":
          description: Authoritative persisted events, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventBatchAck"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/runners/secrets/access:
    post:
      summary: Authorize and audit one fenced runner-local secret access
      operationId: authorizeRunnerSecretAccess
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretAccessInput"
      responses:
        "200":
          description: Safe idempotent secret-access authorization metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretAccessGrant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/sessions:
    get:
      summary: List local sessions (system administrator)
      operationId: listSessions
      responses:
        "200":
          description: Session metadata, never raw credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a local session
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created. The token is returned once and should be stored by the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      summary: Revoke the current session
      operationId: revokeSession
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sessions/revoke:
    post:
      summary: Revoke a local session (system administrator)
      operationId: revokeSessionByID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionRequest"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/browser-sessions:
    post:
      summary: Create a browser session
      operationId: createBrowserSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Browser session created. The session credential is set only in the HttpOnly `nerocd_session` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      summary: Revoke the current browser session
      operationId: revokeBrowserSession
      security:
        - browserSession: []
      responses:
        "204":
          description: Browser session revoked and cookie expired.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/api-tokens:
    post:
      summary: Create a platform API token
      operationId: createAPIToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: API token created. The bearer token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenRegistration"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/api-tokens/revoke:
    post:
      summary: Revoke a platform API token
      operationId: revokeAPIToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAPITokenInput"
      responses:
        "200":
          description: API token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/capabilities:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List configured and planned platform capabilities
      operationId: listCapabilities
      responses:
        "200":
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
