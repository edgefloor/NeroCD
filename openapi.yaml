openapi: 3.1.0
info:
  title: NeroCD API
  version: 0.1.0
  description: |
    Public REST API for the NeroCD automation control plane.

    All public routes are versioned under `/api/v1`. List responses use a stable
    `{ "items": [...] }` envelope. Error responses use
    `{ "code": "stable_code", "error": "message" }`.

    List endpoints return a stable `{ "items": [...] }` envelope plus
    pagination metadata: `limit`, `offset`, `count`, and `total`. Clients can
    request `limit` and `offset` query parameters. Filtering is documented per
    endpoint. Mutations consume JSON request bodies and return the created
    resource or validation errors.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/ready:
    get:
      summary: Check API readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: API dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      summary: Get the current principal
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Current authenticated or bootstrap principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sessions:
    post:
      summary: Create a local session
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created. The token is returned once and should be stored by the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      summary: Revoke the current session
      operationId: revokeSession
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/api-tokens:
    post:
      summary: Create a platform API token
      operationId: createAPIToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: API token created. The bearer token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenRegistration"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/api-tokens/revoke:
    post:
      summary: Revoke a platform API token
      operationId: revokeAPIToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAPITokenInput"
      responses:
        "200":
          description: API token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/capabilities:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List configured and planned platform capabilities
      operationId: listCapabilities
      responses:
        "200":
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: string
                - $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/projects/archive:
    post:
      summary: Archive project
      operationId: archiveProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/templates:
    get:
      summary: List task templates
      operationId: listTemplates
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Task template list. When `project_id` is supplied, only templates in that project are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplateListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Create task template
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created task template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update task template
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: string
                - $ref: "#/components/schemas/TemplateInput"
      responses:
        "200":
          description: Updated task template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/repositories:
    get:
      summary: List source repositories
      operationId: listRepositories
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Repository list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryListResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create source repository
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryInput"
      responses:
        "201":
          description: Created repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/project-members:
    get:
      summary: List project members
      operationId: listProjectMembers
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Project member list. When `project_id` is supplied, only members for that project are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Grant or update project access
      operationId: upsertProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberInput"
      responses:
        "200":
          description: Project member access updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/project-role:
    get:
      summary: Fetch the current principal's effective project role
      operationId: getProjectRole
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Effective project role and coarse permissions for the current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRole"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/access-keys:
    get:
      summary: List project access key metadata
      operationId: listAccessKeys
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Access key metadata list. Secret values are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create project access key metadata
      operationId: createAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyInput"
      responses:
        "201":
          description: Created access key metadata. Secret values are not accepted or returned by this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/inventories:
    get:
      summary: List project inventory metadata
      operationId: listInventories
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Inventory metadata list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create project inventory metadata
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Created inventory metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/runner-primitive-plan:
    get:
      summary: Get runner primitive plan for a run
      operationId: getRunnerPrimitivePlan
      parameters:
        - name: run_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runner primitive plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerPrimitivePlan"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runs:
    get:
      summary: List task runs
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Task run list. When `project_id` is supplied, only runs in that project are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Request task run
      operationId: requestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequestInput"
      responses:
        "201":
          description: Created task run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRun"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/runs/approve:
    post:
      summary: Approve a waiting run
      operationId: approveRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id:
                  type: string
      responses:
        "200":
          description: Approved run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/runs/reject:
    post:
      summary: Reject a waiting run
      operationId: rejectRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id:
                  type: string
      responses:
        "200":
          description: Rejected approval and canceled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runs/cancel:
    post:
      summary: Cancel a run
      operationId: cancelRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id:
                  type: string
      responses:
        "200":
          description: Canceled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRun"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List runners
      operationId: listRunners
      responses:
        "200":
          description: Runner list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/runners/register:
    post:
      summary: Register runner
      operationId: registerRunner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerInput"
      responses:
        "201":
          description: Registered runner and one-time runner token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistration"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/runners/rotate-token:
    post:
      summary: Rotate runner token
      operationId: rotateRunnerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerTokenInput"
      responses:
        "200":
          description: Rotated runner token. The token is only returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistration"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners/revoke-token:
    post:
      summary: Revoke runner token
      operationId: revokeRunnerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerTokenInput"
      responses:
        "200":
          description: Revoked runner token and marked runner revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners/heartbeat:
    post:
      summary: Heartbeat runner
      operationId: heartbeatRunner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners/claim:
    post:
      summary: Claim queued run
      operationId: claimRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Claimed run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedRun"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners/lease:
    get:
      summary: Get runner lease status
      operationId: getRunnerLease
      parameters:
        - in: query
          name: lease_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runner-scoped lease status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLease"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runners/logs:
    post:
      summary: Append runner log
      operationId: appendRunnerLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunLogInput"
      responses:
        "201":
          description: Created run log entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLog"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/runners/artifacts:
    post:
      summary: Record runner artifact metadata
      operationId: createRunArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInput"
      responses:
        "201":
          description: Created artifact record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRecord"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/runners/complete:
    post:
      summary: Complete run lease
      operationId: completeLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, status]
              properties:
                lease_id:
                  type: string
                status:
                  type: string
      responses:
        "200":
          description: Completed lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLease"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/run-logs:
    get:
      summary: List run logs
      operationId: listRunLogs
      parameters:
        - name: run_id
          in: query
          required: false
          description: Optional run identifier filter.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Run log list. When `run_id` is supplied, only logs for that run are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLogListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/artifacts:
    get:
      summary: List run artifact records
      operationId: listRunArtifacts
      parameters:
        - name: run_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Run artifact list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List approvals
      operationId: listApprovals
      responses:
        "200":
          description: Approval list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/audit-events:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List audit events
      operationId: listAuditEvents
      responses:
        "200":
          description: Audit event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
