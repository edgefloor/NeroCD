            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "destination_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
          },
          "mode": {
            "type": "string",
            "enum": [
              "validate",
              "upload",
              "download"
            ]
          },
          "backup_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
          },
          "restore_operation_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
          },
          "state": {
            "type": "string",
            "enum": [
              "queued",
              "dispatched",
              "applying",
              "succeeded",
              "failed",
              "uncertain"
            ]
          },
          "failure_code": {
            "type": "string",
            "enum": [
              "",
              "access_denied",
              "network_denied",
              "remote_unavailable",
              "object_mismatch",
              "archive_unavailable",
              "interrupted",
              "authority_denied"
            ]
          },
          "blob": {
            "$ref": "#/components/schemas/HostingDatabaseBackupBlob"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "description": "Safe transfer metadata. Upload and download require backup_id and blob. Download also requires restore_operation_id. Validate omits all three; upload omits restore_operation_id.",
        "oneOf": [
          {
            "properties": {
              "mode": {
                "const": "validate"
              }
            },
            "not": {
              "anyOf": [
                {
                  "required": [
                    "backup_id"
                  ]
                },
                {
                  "required": [
                    "blob"
                  ]
                },
                {
                  "required": [
                    "restore_operation_id"
                  ]
                }
              ]
            },
            "type": "object",
            "required": [
              "mode"
            ]
          },
          {
            "properties": {
              "mode": {
                "const": "upload"
              },
              "backup_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
              },
              "blob": {
                "$ref": "#/components/schemas/HostingDatabaseBackupBlob"
              }
            },
            "required": [
              "backup_id",
              "blob",
              "mode"
            ],
            "not": {
              "required": [
                "restore_operation_id"
              ]
            },
            "type": "object"
          },
          {
            "properties": {
              "mode": {
                "const": "download"
              },
              "backup_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
              },
              "blob": {
                "$ref": "#/components/schemas/HostingDatabaseBackupBlob"
              },
              "restore_operation_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
              }
            },
            "required": [
              "backup_id",
