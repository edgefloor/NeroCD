      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingAuthority'
      responses:
        '200':
          description: Immutable one-use download plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingStorageBackupDownloadPlan'
        '403': {description: Authority denied}
        '503': {description: Controller rendezvous unavailable}
  /api/v1/runners/hosting/storage-backup-download/stream:
    post:
      operationId: runnerStorageBackupDownloadStream
      summary: Send one verified local archive to its waiting browser request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata]
              properties:
                metadata:
                  $ref: '#/components/schemas/HostingStorageBackupDownloadStream'
                archive: {type: string, format: binary}
            encoding:
              metadata: {contentType: application/json}
              archive: {contentType: application/x-tar}
      responses:
        '200':
          description: Exact stream or unavailable-copy notice acknowledged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session_id, plan_hash]
                properties:
                  session_id: {type: string}
                  plan_hash: {type: string}
        '403': {description: Authority denied}
        '409': {description: Stream identity or framing mismatch}
        '503': {description: Controller rendezvous unavailable}
  /api/v1/storage-backups/{id}/archive-options:
    get:
      operationId: storageBackupArchiveOptions
      summary: Check current owner access to a local backup archive download
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current download eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingStorageBackupDownloadOptions'
        '403':
          description: Current owner or destination access denied
  /api/v1/storage-backups/{id}/archive:
    get:
      operationId: downloadStorageBackupArchive
      summary: Stream one exact local backup archive through a single controller
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Verified local archive attachment
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        '403': {description: Authority revoked}
        '404': {description: Local copy missing}
        '409': {description: Backup state or copy reservation changed}
        '429': {description: Download capacity exhausted}
        '503': {description: Download capability or controller rendezvous unavailable}
        '504': {description: Download deadline exceeded}
