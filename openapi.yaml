components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: NeroCD session token
      description: CLI session and API token credential.
    browserSession:
      type: apiKey
      in: cookie
      name: nerocd_session
      description: "Browser-only local session cookie. Unsafe cookie-authenticated requests require X-NeroCD-CSRF: 1."
  parameters:
    ProjectID:
      name: project_id
      in: query
      required: false
      description: Optional project identifier filter.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (0-100). Omit to use the bounded default.
      schema:
        type: integer
        minimum: 0
        maximum: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the filtered result.
      schema:
        type: integer
        minimum: 0
        maximum: 100000
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    NotificationConfiguration:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {
          "webhook_url": {
            "type": "string",
            "maxLength": 4096
          },
          "smtp_host": {
            "type": "string",
            "maxLength": 253
          },
          "smtp_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          },
          "smtp_security": {
            "type": "string",
            "enum": [
              "starttls",
              "tls"
            ]
          },
          "smtp_username": {
            "type": "string",
            "maxLength": 256
          },
          "smtp_password": {
            "type": "string",
            "maxLength": 4096
          },
          "from_address": {
            "type": "string",
            "format": "email"
          },
          "recipient_user_ids": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
            }
          }
        },
        "writeOnly": true,
        "description": "Write-only whole configuration, encrypted at rest. Webhook uses only webhook_url; email requires SMTP host/port/security/from and current project member IDs. Username and password must both be supplied or both omitted. No read API returns configuration."
      }
    NotificationChannelInput:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "request_id",
          "expected_generation",
          "name",
