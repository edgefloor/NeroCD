          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List approvals
      operationId: listApprovals
      responses:
        "200":
          description: Approval list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/audit-events:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      summary: List audit events
      operationId: listAuditEvents
      responses:
        "200":
          description: Audit event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: NeroCD session token
      description: CLI session and API token credential.
    browserSession:
      type: apiKey
      in: cookie
      name: nerocd_session
      description: "Browser-only local session cookie. Unsafe cookie-authenticated requests require X-NeroCD-CSRF: 1."
  parameters:
    ProjectID:
      name: project_id
      in: query
      required: false
      description: Optional project identifier filter.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (0-100). Omit to use the bounded default.
      schema:
        type: integer
        minimum: 0
        maximum: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the filtered result.
      schema:
        type: integer
        minimum: 0
        maximum: 100000
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PaginatedResponse:
      type: object
      required: [items, limit, offset, count, total]
      properties:
        items: {type: array, items: {}}
        limit: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        count: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    ServiceInput:
      type: object
      required: [project_id, name, repository_id, compose_path]
      properties:
        project_id: {type: string}
        name: {type: string}
        repository_id: {type: string}
        compose_path: {type: string}
        profiles: {type: array, items: {type: string}}
    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          required: [id, owner_id, created_at]
          properties:
            id: {type: string}
            owner_id: {type: string}
            created_at: {type: string, format: date-time}
    SecretBindingMetadata:
      type: object
      required: [name, provider, reference, target, required]
      properties:
        name: {type: string}
        provider: {type: string}
        reference: {type: string}
        target: {type: string}
        required: {type: boolean}
        version: {type: string}
        fingerprint: {type: string}
        redact_encodings: {type: array, items: {type: string}}
        classification: {type: string}
    HealthPolicy:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, format: uri}
        allowed_hosts: {type: array, items: {type: string}}
        allowed_cidrs: {type: array, items: {type: string, format: cidr}}
        allowed_ports: {type: array, items: {type: integer, minimum: 1, maximum: 65535}}
        allow_http: {type: boolean, description: Explicitly permits HTTP only for an allowed CIDR fixture address.}
        expected_revision: {type: string}
        interval_seconds: {type: number, exclusiveMinimum: 0}
        timeout_seconds: {type: number, exclusiveMinimum: 0}
        expected_status: {type: integer, minimum: 200, maximum: 299}
    EnvironmentInput:
      type: object
      required: [service_id, name, compose_project, timeout_seconds]
      properties:
        service_id: {type: string}
        name: {type: string}
        runner_selector: {type: array, items: {type: string}}
        compose_project: {type: string}
        health_policy: {$ref: "#/components/schemas/HealthPolicy"}
        confirmation_required: {type: boolean}
        timeout_seconds: {type: integer, minimum: 1}
        secret_bindings: {type: array, items: {$ref: "#/components/schemas/SecretBindingMetadata"}}
        rollback_safe: {type: boolean}
    Environment:
      allOf:
        - $ref: "#/components/schemas/EnvironmentInput"
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string}
            current_healthy_revision_id: {type: [string, "null"]}
            created_at: {type: string, format: date-time}
    RevisionInput:
      type: object
      required: [service_id, requested_ref]
      properties:
        service_id: {type: string}
        requested_ref: {type: string}
    Revision:
      type: object
      required: [id, service_id, requested_ref, git_commit, compose_hash, image_digests, content_identity, provenance_state, provenance_resolved, created_by, created_at]
      properties:
        id: {type: string}
        service_id: {type: string}
        requested_ref: {type: string}
        git_commit: {type: string}
        compose_hash: {type: string}
        image_digests: {type: array, items: {type: string}}
        content_identity: {type: string}
        provenance_state: {type: string, enum: [pending, resolved, legacy_unverified]}
        provenance_resolved: {type: boolean}
        resolved_at: {type: [string, "null"], format: date-time}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    DeploymentInput:
      type: object
      required: [environment_id, desired_revision_id, idempotency_key]
      properties:
        environment_id: {type: string}
        desired_revision_id: {type: string}
        idempotency_key: {type: string, minLength: 1}
        rollback_of_id: {type: [string, "null"]}
    DeploymentTransitionInput:
      type: object
      required: [deployment_id, run_id, lease_id, attempt, fence, transition_key, expected_status, target_status]
      properties:
        deployment_id: {type: string}
        run_id: {type: string}
        lease_id: {type: string}
        attempt: {type: integer, minimum: 1}
        fence: {type: string, minLength: 1}
        transition_key: {type: string, minLength: 1}
        expected_status: {type: string, enum: [queued, waiting_confirmation, assigned, preparing, applying, verifying, failed, cancel_requested, rolling_back]}
        target_status: {type: string, enum: [waiting_confirmation, assigned, preparing, applying, verifying, succeeded, failed, canceled, cancel_requested, rolling_back, rolled_back, rollback_failed, manual_intervention]}
        health_passed: {type: [boolean, "null"]}
        failure_code: {type: string}
        metadata: {type: object, additionalProperties: true}
    DeploymentCancelInput:
      type: object
      required: [deployment_id, request_id]
      properties:
        deployment_id: {type: string}
        request_id: {type: string, minLength: 1}
    DeploymentFailureRollbackInput:
      type: object
      required: [deployment_id, run_id, lease_id, attempt, fence, request_id, expected_status, failure_code]
      properties:
        deployment_id: {type: string}
        run_id: {type: string}
        lease_id: {type: string}
        attempt: {type: integer, minimum: 1}
        fence: {type: string}
        request_id: {type: string}
        expected_status: {type: string, enum: [applying, verifying, cancel_requested]}
        cancellation_request_id: {type: string}
        failure_code: {type: string}
        metadata: {type: object, additionalProperties: true}
    DeploymentFailureRollbackResult:
      type: object
      required: [failed, rollback]
      properties:
        failed: {$ref: "#/components/schemas/Deployment"}
        rollback: {$ref: "#/components/schemas/Deployment"}
    ProvenanceResolutionInput:
      type: object
      required: [deployment_id, run_id, lease_id, attempt, fence, resolution_id, git_commit, compose_hash, image_digests, content_identity]
      properties:
        deployment_id: {type: string}
        run_id: {type: string}
        lease_id: {type: string}
        attempt: {type: integer, minimum: 1}
        fence: {type: string, minLength: 1}
        resolution_id: {type: string, minLength: 1}
        git_commit: {type: string, pattern: '^[0-9a-f]{40,64}$'}
        compose_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        image_digests: {type: array, minItems: 1, items: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}
        content_identity: {type: string}
    DeploymentPlan:
      type: object
      required: [deployment_id, run_id, lease_id, attempt, fence, project_id, service_id, environment_id, repository_id, repository_url, repository_policy, requested_ref, compose_path, compose_project, timeout_seconds, health_policy, secret_bindings, rollback_safe]
      properties:
        deployment_id: {type: string}
        run_id: {type: string}
        lease_id: {type: string}
        attempt: {type: integer}
        fence: {type: string}
        project_id: {type: string}
        service_id: {type: string}
        environment_id: {type: string}
        repository_id: {type: string}
        repository_url: {type: string}
        repository_policy: {$ref: "#/components/schemas/RepositoryPolicy"}
        requested_ref: {type: string}
        compose_path: {type: string}
        profiles: {type: array, items: {type: string}}
        compose_project: {type: string}
        timeout_seconds: {type: integer}
        health_policy: {$ref: "#/components/schemas/HealthPolicy"}
        secret_bindings: {type: array, items: {type: object}}
        rollback_safe: {type: boolean}
        status: {type: string, enum: [assigned, preparing, applying, verifying, cancel_requested]}
        cancellation_request_id: {type: [string, "null"]}
    DeploymentConfirmationInput:
      type: object
      required: [id]
      properties:
        id: {type: string}
    PreAssignmentFailureInput:
      type: object
      required: [id, failure_code]
      properties:
        id: {type: string}
        failure_code: {type: string, minLength: 1}
    Deployment:
      allOf:
        - $ref: "#/components/schemas/DeploymentInput"
        - type: object
          required: [id, status, requested_by, created_at, updated_at, fence_required]
          properties:
            id: {type: string}
            previous_healthy_revision_id: {type: [string, "null"]}
            task_run_id: {type: [string, "null"]}
            rollback_of_id: {type: [string, "null"]}
            status: {type: string, enum: [queued, waiting_confirmation, assigned, preparing, applying, verifying, succeeded, failed, canceled, cancel_requested, rolling_back, rolled_back, rollback_failed, manual_intervention]}
            requested_by: {type: string}
            confirmed_by: {type: [string, "null"]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            finished_at: {type: [string, "null"], format: date-time}
            health_passed: {type: [boolean, "null"]}
            failure_code: {type: string}
            fence_required: {type: boolean}
    ServiceListResponse:
      allOf: [{$ref: "#/components/schemas/PaginatedResponse"}, {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Service"}}}}]
    EnvironmentListResponse:
      allOf: [{$ref: "#/components/schemas/PaginatedResponse"}, {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Environment"}}}}]
    RevisionListResponse:
      allOf: [{$ref: "#/components/schemas/PaginatedResponse"}, {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Revision"}}}}]
    DeploymentListResponse:
      allOf: [{$ref: "#/components/schemas/PaginatedResponse"}, {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Deployment"}}}}]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        error:
          type: string
    BootstrapStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [required, complete]}
    OIDCStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    OperationsUnavailable:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, enum: [bootstrap_status_unavailable, operations_unavailable]}
    DurationAggregate:
      type: object
      additionalProperties: false
      required: [count, sum_seconds]
      properties:
        count: {type: integer, minimum: 0}
        sum_seconds: {type: number, minimum: 0}
    PoolState:
      type: object
      additionalProperties: false
      required: [total, idle, acquired]
      properties:
        total: {type: integer, minimum: 0}
        idle: {type: integer, minimum: 0}
        acquired: {type: integer, minimum: 0}
    OperationalSnapshot:
      type: object
      additionalProperties: false
      required: [collected_at, queue_depth, queue_oldest_age_seconds, active_leases, expired_leases, oldest_runner_heartbeat_seconds, terminal_runs, deployments, deployment_health_passed, deployment_health_failed, rollback_succeeded, rollback_failed, runner_journal_depth, runner_retry_count, runner_renew_failures, backup_age_seconds, backup_outcome, backup_reason, backup_schedule_status, backup_schedule_next_seconds, backup_schedule_failures, pool]
      properties:
        collected_at: {type: string, format: date-time}
        queue_depth: {type: integer, minimum: 0}
        queue_oldest_age_seconds: {type: number, minimum: 0}
        active_leases: {type: integer, minimum: 0}
        expired_leases: {type: integer, minimum: 0}
        oldest_runner_heartbeat_seconds: {type: number, minimum: 0}
        terminal_runs:
          type: object
          additionalProperties: false
          properties:
            succeeded: {$ref: "#/components/schemas/DurationAggregate"}
            failed: {$ref: "#/components/schemas/DurationAggregate"}
            canceled: {$ref: "#/components/schemas/DurationAggregate"}
        deployments:
          type: object
          additionalProperties: false
          properties:
            queued: {type: integer, minimum: 0}
            waiting_confirmation: {type: integer, minimum: 0}
            assigned: {type: integer, minimum: 0}
            preparing: {type: integer, minimum: 0}
            applying: {type: integer, minimum: 0}
            verifying: {type: integer, minimum: 0}
            cancel_requested: {type: integer, minimum: 0}
            rolling_back: {type: integer, minimum: 0}
            succeeded: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            rolled_back: {type: integer, minimum: 0}
            rollback_failed: {type: integer, minimum: 0}
            canceled: {type: integer, minimum: 0}
            manual_intervention: {type: integer, minimum: 0}
        deployment_health_passed: {type: integer, minimum: 0}
        deployment_health_failed: {type: integer, minimum: 0}
        rollback_succeeded: {type: integer, minimum: 0}
        rollback_failed: {type: integer, minimum: 0}
        runner_journal_depth: {type: integer, minimum: 0}
        runner_retry_count: {type: integer, minimum: 0}
        runner_renew_failures: {type: integer, minimum: 0}
        backup_age_seconds: {type: number, minimum: 0}
        backup_outcome: {type: string, enum: [none, success, failure]}
        backup_reason: {type: string, enum: [none, preflight, dump, publish, database]}
        backup_schedule_status: {type: string, enum: [disabled, waiting, due, running, backoff]}
        backup_schedule_next_seconds: {type: number, minimum: 0}
        backup_schedule_failures: {type: integer, minimum: 0, maximum: 8}
        pool: {$ref: "#/components/schemas/PoolState"}
    OperationsStatus:
      type: object
      additionalProperties: false
      required: [readiness, snapshot]
      properties:
        readiness: {type: string, enum: [ready]}
        snapshot: {$ref: "#/components/schemas/OperationalSnapshot"}
    RunLogRetentionPolicy:
      type: object
      additionalProperties: false
      required: [enabled, keep_days, batch_size, version, updated_at]
      properties:
        enabled: {type: boolean}
        keep_days: {type: integer, minimum: 1, maximum: 3650}
        batch_size: {type: integer, minimum: 1, maximum: 10000}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    RunLogRetentionPolicyInput:
      type: object
      additionalProperties: false
      required: [enabled, keep_days, batch_size]
      properties:
        enabled: {type: boolean}
        keep_days: {type: integer, minimum: 1, maximum: 3650}
        batch_size: {type: integer, minimum: 1, maximum: 10000}
    RunLogRetentionPreview:
      type: object
      additionalProperties: false
      required: [cutoff, eligible_logs, eligible_bytes]
      properties:
        cutoff: {type: string, format: date-time}
        eligible_logs: {type: integer, minimum: 0, format: int64}
        eligible_bytes: {type: integer, minimum: 0, format: int64}
    RunLogRetentionStatus:
      type: object
      additionalProperties: false
      required: [policy, preview]
      properties:
        policy: {$ref: "#/components/schemas/RunLogRetentionPolicy"}
        preview: {$ref: "#/components/schemas/RunLogRetentionPreview"}
    RunLogRetentionExecuteInput:
      type: object
      additionalProperties: false
      required: [policy_version]
      properties:
        policy_version: {type: integer, minimum: 1}
    RunLogRetentionExecution:
      type: object
      additionalProperties: false
      required: [request_id, policy, preview, deleted, deleted_bytes]
      properties:
        request_id: {type: string}
        policy: {$ref: "#/components/schemas/RunLogRetentionPolicy"}
        preview: {$ref: "#/components/schemas/RunLogRetentionPreview"}
        deleted: {type: integer, minimum: 0, format: int64}
        deleted_bytes: {type: integer, minimum: 0, format: int64}
    ErrorResponse:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum: [unauthenticated, forbidden, not_found, bad_request, internal_error]
        error:
          type: string
    Principal:
