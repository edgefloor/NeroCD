components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: NeroCD session token
      description: Future authenticated routes will accept the token returned by `POST /api/v1/sessions`.
  parameters:
    ProjectID:
      name: project_id
      in: query
      required: false
      description: Optional project identifier filter.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Defaults to the full filtered result.
      schema:
        type: integer
        minimum: 0
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip from the filtered result.
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
