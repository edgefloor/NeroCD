        previous_state_hash: {type: string, pattern: '^(|sha256:[a-f0-9]{64})$'}
        stage_hash: {type: string, pattern: '^(|sha256:[a-f0-9]{64})$'}
        candidate_hash: {type: string, pattern: '^(|sha256:[a-f0-9]{64})$'}
        recovery_actions:
          type: array
          maxItems: 1
          uniqueItems: true
          items: {type: string, enum: [resume_predecessor, complete_replacement]}
        recovery_action: {type: string, enum: ['', resume_predecessor, complete_replacement]}
        recovery_state: {type: string, enum: [none, queued, running, succeeded, uncertain]}
      allOf:
        - oneOf:
            - properties: {stage_hash: {enum: ['']}, candidate_hash: {enum: ['']}}
            - properties: {stage_hash: {pattern: '^sha256:[a-f0-9]{64}$'}, candidate_hash: {pattern: '^sha256:[a-f0-9]{64}$'}}
        - oneOf:
            - properties: {recovery_action: {enum: ['']}, recovery_state: {enum: [none]}}
            - properties: {recovery_action: {enum: [resume_predecessor, complete_replacement]}, recovery_state: {enum: [queued, running, succeeded, uncertain]}}
