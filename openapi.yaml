openapi: 3.1.0
info:
  title: NeroCD API
  version: 0.1.0
  description: |
    Public REST API for the NeroCD automation control plane.

    All public routes are versioned under `/api/v1`. List responses use a stable
    `{ "items": [...] }` envelope. Error responses use
    `{ "code": "stable_code", "error": "message" }`.

    List endpoints return a stable `{ "items": [...] }` envelope plus
    pagination metadata: `limit`, `offset`, `count`, and `total`. Clients can
    request `limit` and `offset` query parameters. Filtering is documented per
    endpoint. Mutations consume JSON request bodies and return the created
    resource or validation errors.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
security:
  - bearerAuth: []
  - browserSession: []
paths:
  "/api/v1/runner/server-readiness/challenge": {"post": {"operationId": "issueServerReadiness", "summary": "issueServerReadiness", "description": "Diagnostic basic_image_hosting.v1 only. No deployment admission authority. Cache-Control: no-store. Reports and challenge bodies at most 8 KiB. Challenge deadline ten seconds; accepted sample fresh for thirty seconds without replay extension.", "responses": {"200": {"description": "Bounded diagnostic result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ServerReadinessChallenge"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": [], "properties": {}}}}}}}
  "/api/v1/runner/server-readiness/report": {"post": {"operationId": "reportServerReadiness", "summary": "reportServerReadiness", "description": "Diagnostic basic_image_hosting.v1 only. No deployment admission authority. Cache-Control: no-store. Reports and challenge bodies at most 8 KiB. Challenge deadline ten seconds; accepted sample fresh for thirty seconds without replay extension.", "responses": {"200": {"description": "Bounded diagnostic result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ServerReadinessAck"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ServerReadinessReport"}}}}}}
  "/api/v1/servers/{id}/readiness": {"get": {"operationId": "getServerReadiness", "summary": "getServerReadiness", "description": "Diagnostic basic_image_hosting.v1 only. No deployment admission authority. Cache-Control: no-store. Reports and challenge bodies at most 8 KiB. Challenge deadline ten seconds; accepted sample fresh for thirty seconds without replay extension.", "responses": {"200": {"description": "Bounded diagnostic result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ServerReadiness"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}]}}
  "/api/v1/resources/{id}/github-push-policy": {"get": {"operationId": "getGitHubPushPolicy", "summary": "getGitHubPushPolicy", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushPolicy"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}, "put": {"operationId": "configureGitHubPushPolicy", "summary": "configureGitHubPushPolicy", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushPolicy"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushConfigure"}}}}}}
  "/api/v1/resources/{id}/github-push-policy/verify": {"post": {"operationId": "verifyGitHubPushPolicy", "summary": "verifyGitHubPushPolicy", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushPolicy"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushCommand"}}}}}}
  "/api/v1/resources/{id}/github-push-policy/enabled": {"post": {"operationId": "setGitHubPushEnabled", "summary": "setGitHubPushEnabled", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushPolicy"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushEnable"}}}}}}
  "/api/v1/resources/{id}/github-push-policy/retry": {"post": {"operationId": "retryGitHubPushDelivery", "summary": "retryGitHubPushDelivery", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushDelivery"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushRetry"}}}}}}
  "/api/v1/resources/{id}/github-push-policy/deliveries": {"get": {"operationId": "listGitHubPushDeliveries", "summary": "listGitHubPushDeliveries", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 50}}, {"name": "cursor", "in": "query", "schema": {"type": "string", "format": "uuid"}}], "responses": {"200": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushDeliveryPage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}}
  "/api/v1/hosting/github-push/{id}": {"post": {"operationId": "receiveGitHubPush", "summary": "receiveGitHubPush", "description": "Build on push, manual deployment. GitHub.com HTTPS and one exact branch only. Current authority and explicit managed-secret purposes required. No-store responses. Verification has one overall 20-second deadline, each provider request at most five seconds. Signed after commit must equal independently verified current branch HEAD. Fast-forward comparison supports at most 100 commits. Reconfiguration explicitly resets the verified baseline. Pending attempts are bounded to 32 or 24 hours; terminal receipts retained up to 72 hours. Stable commit build identity survives receipt cleanup. HMAC-SHA256 over the exact raw body before JSON parsing. Signature, event and canonical delivery UUID headers must each occur exactly once. Valid signed ping returns 202 ignored. No raw payload, signature, credentials or payload URLs are retained.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}, {"name": "X-Hub-Signature-256", "in": "header", "required": true, "schema": {"type": "string", "maxLength": 71}}, {"name": "X-GitHub-Event", "in": "header", "required": true, "schema": {"type": "string", "maxLength": 4}}, {"name": "X-GitHub-Delivery", "in": "header", "required": true, "schema": {"type": "string", "maxLength": 36}}], "responses": {"202": {"description": "Bounded metadata; Cache-Control: no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GitHubPushReceipt"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "maxProperties": 256, "description": "GitHub extensible ping/push payload, at most 1 MiB raw. Only exact repository ID, fork, ref, before, after, deleted and forced are interpreted after authentication."}}}}}}
  "/api/v1/resources/{id}/runtime-log-sessions": {"post": {"operationId": "openRuntimeLogSession", "summary": "openRuntimeLogSession", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogSession"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogOpen"}}}}}}
  "/api/v1/runtime-log-sessions/{id}/renew": {"post": {"operationId": "renewRuntimeLogSession", "summary": "renewRuntimeLogSession", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogSession"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {}}}}}}}
  "/api/v1/runtime-log-sessions/{id}": {"delete": {"operationId": "closeRuntimeLogSession", "summary": "closeRuntimeLogSession", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogSession"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}], "requestBody": {"required": false, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {}}}}}}}
  "/api/v1/runtime-log-sessions/{id}/logs": {"get": {"operationId": "runtimeLogPage", "summary": "runtimeLogPage", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogPage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}, {"name": "after_sequence", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 2147483647, "default": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 200}}]}}
  "/api/v1/runners/runtime-log-sessions/claim": {"post": {"operationId": "claimRuntimeLogSessions", "summary": "claimRuntimeLogSessions", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogClaims"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogClaimInput"}}}}, "security": [{"bearerAuth": []}]}}
  "/api/v1/runners/runtime-log-sessions/events": {"post": {"operationId": "appendRuntimeLogs", "summary": "appendRuntimeLogs", "description": "Opt-in sensitive runtime output bound to the session actor and immutable settled target. Current viewer and original destination grant, runner credential and enrollment remain required. Demand30s, collector lease10s, retention5min after end or demand expiry. Source gaps and server accepted-order sequence do not promise exactly-once Docker capture. New requests recheck cookie validity; admitted background demand can remain for at most30s after cookie revocation. Request deadlines are frozen across open retries.", "responses": {"200": {"description": "Bounded sensitive runtime result with Cache-Control:no-store", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogAck"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "410": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeLogBatch"}}}}, "security": [{"bearerAuth": []}]}}
  "/api/v1/runners/hosting-observations/targets": {"post": {"operationId": "hostingObservationTargets", "summary": "hostingObservationTargets", "description": "Bounded continuous hosting evidence independent of deployment recovery. Disk, CPU and memory observations are unsupported. Each target or report is at most 8 KiB; target pages are at most 50 targets and 512 KiB. Current authority is required.", "responses": {"200": {"description": "Bounded result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingObservationTargets"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingObservationTargetsInput"}}}}}}
  "/api/v1/runners/hosting-observations/report": {"post": {"operationId": "reportHostingObservation", "summary": "reportHostingObservation", "description": "Bounded continuous hosting evidence independent of deployment recovery. Disk, CPU and memory observations are unsupported. Each target or report is at most 8 KiB; target pages are at most 50 targets and 512 KiB. Current authority is required.", "responses": {"200": {"description": "Bounded result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingObservationAck"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeObservation"}}}}}}
  "/api/v1/resources/{id}/runtime-status": {"get": {"operationId": "hostingRuntimeStatus", "summary": "hostingRuntimeStatus", "description": "Bounded continuous hosting evidence independent of deployment recovery. Disk, CPU and memory observations are unsupported. Each target or report is at most 8 KiB; target pages are at most 50 targets and 512 KiB. Current authority is required.", "responses": {"200": {"description": "Bounded result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeStatus"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 128}}]}}
  "/api/v1/runners/hosting/runtime-environment": {"post": {"operationId": "deliverHostingRuntimeEnvironment", "summary": "Deliver a prepared hosting runtime environment", "description": "Prepared deploy authority only. Current actor, runner, lease, destination, configuration and active pinned secret references are rechecked for each request. Audit metadata commits before decryption. The original delivery deadline is at most 60 seconds and capped by lease expiry; retries never extend it. Cache-Control: no-store on every response. Direct TLS or trusted immediate TLS termination required. Values go only through the protected codec. Docker administrators can inspect resulting Config.Env; delivered bytes cannot be instantly revoked.", "security": [{"bearerAuth": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeEnvironmentRequest"}}}}, "responses": {"200": {"description": "Protected environment, at most 512 KiB encoded", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HostingRuntimeEnvironment"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}}
