services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment: {POSTGRES_DB: nerocd, POSTGRES_USER: nerocd, POSTGRES_PASSWORD: provenance_runtime_only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [runtime]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U nerocd -d nerocd"], interval: 1s, timeout: 1s, retries: 30}
  server:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      NEROCD_DATABASE_URL: postgres://nerocd:provenance_runtime_only@postgres:5432/nerocd?sslmode=disable
      NEROCD_REQUIRE_DATABASE: "true"
      NEROCD_LEASE_TTL: 90s
      NEROCD_REAPER_INTERVAL: 1s
    entrypoint: [/bin/sh, -ec]
    command: ["nerocd migrate && nerocd seed-dev --seed-file /run/nerocd-dev-seed/dev.sql && exec nerocd server --addr :8080"]
    volumes: [../../db/seeds/dev.sql:/run/nerocd-dev-seed/dev.sql:ro]
    ports: ["127.0.0.1::8080"]
    networks: [runtime]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck: {test: [CMD, nerocd, health, --addr, http://127.0.0.1:8080], interval: 1s, timeout: 2s, retries: 30}
  proxy:
    build: {context: ../runtime-spool/proxy}
    depends_on: {server: {condition: service_healthy}}
    environment: {UPSTREAM_URL: http://server:8080}
    ports: ["127.0.0.1::8081"]
    networks: [runtime]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/__control/status], interval: 1s, timeout: 2s, retries: 30}
  git:
    build: {context: ., dockerfile: GitDockerfile}
    image: ${NEROCD_GIT_FIXTURE_IMAGE:?set NEROCD_GIT_FIXTURE_IMAGE}
    entrypoint: [/bin/sh, -ec]
    command: ["sshd -t -f /git/sshd_config && exec /usr/sbin/sshd -D -e -f /git/sshd_config"]
    volumes: [git-data:/git:ro]
    networks: [runtime]
    tmpfs: [/tmp, /run]
    healthcheck: {test: [CMD-SHELL, "sshd -t -f /git/sshd_config && ssh-keyscan -T 2 -p 2222 127.0.0.1 >/dev/null 2>&1"], interval: 1s, timeout: 3s, retries: 30}
  git_init:
    image: ${NEROCD_GIT_FIXTURE_IMAGE:?set NEROCD_GIT_FIXTURE_IMAGE}
    profiles: [tools]
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        command -v ssh ssh-keyscan sshd git
        umask 077
        mkdir -p /git/home/.ssh /git/repo.git /git/keys /git/run
        ssh-keygen -q -t ed25519 -N '' -f /git/keys/host
        ssh-keygen -q -t ed25519 -N '' -f /git/keys/deploy
        install -d -m 0700 -o 10001 -g 10001 /runner-secrets/root
        install -m 0400 -o 10001 -g 10001 /git/keys/deploy /runner-secrets/root/cred_git_deploy
        cp /git/keys/deploy.pub /git/home/.ssh/authorized_keys
        chmod 700 /git/home/.ssh; chmod 600 /git/home/.ssh/authorized_keys /git/keys/*
        git init --bare /git/repo.git >/dev/null
        git config --global user.email gate@local; git config --global user.name gate
        git init /git/work >/dev/null; cd /git/work
        printf 'services:\n  fixture:\n    image: busybox@sha256:ec3bd69b159bd7a40ef75b1b46ec7406f708e1c324a5fc7b7e95c4e8d1b4d57c\n' > compose.yaml
        git add compose.yaml; git commit -qm A; git branch -M main; git remote add origin /git/repo.git; git push -q origin main
        printf '# B\n' >> compose.yaml; git add compose.yaml; git commit -qm B; git branch fixture-b; git reset --hard HEAD~1; git push -q --force origin main fixture-b
        git --git-dir=/git/repo.git symbolic-ref HEAD refs/heads/main
        printf 'Port 2222\nListenAddress 0.0.0.0\nHostKey /git/keys/host\nAuthorizedKeysFile /git/home/.ssh/authorized_keys\nPidFile /tmp/sshd.pid\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nChallengeResponseAuthentication no\nPermitRootLogin no\nAllowUsers git\nSubsystem sftp internal-sftp\n' > /git/sshd_config
        chown -R 10002:10002 /git/home /git/repo.git; chmod 755 /git /git/repo.git
    volumes: [git-data:/git, runner-secrets:/runner-secrets]
  git_advance:
    image: ${NEROCD_GIT_FIXTURE_IMAGE:?set NEROCD_GIT_FIXTURE_IMAGE}
    profiles: [tools]
    network_mode: none
    entrypoint: [/bin/sh, -ec]
    command: ["git config --global --add safe.directory /git/repo.git; cd /git/work; test \"$(git rev-parse main)\" != \"$(git rev-parse fixture-b)\"; git push -q --force origin fixture-b:main; git --git-dir=/git/repo.git rev-parse refs/heads/main"]
    volumes: [git-data:/git]
  credential_init:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    profiles: [tools]
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh, -ec]
    command: ["umask 077; IFS= read -r t; test -n \"$${t}\"; printf '%s\\n' \"$${t}\" >/credentials/token; chmod 0600 /credentials/token; chown 10001:10001 /credentials/token; install -d -m 0700 -o 10001 -g 10001 /journal /workspace /secrets/root"]
    volumes: [runner-credential:/credentials, runner-journal:/journal, runner-workspace:/workspace, runner-secrets:/secrets]
  runner:
    image: ${NEROCD_RESOLVER_IMAGE:?set NEROCD_RESOLVER_IMAGE}
    depends_on: {proxy: {condition: service_healthy}, git: {condition: service_healthy}}
    entrypoint: [nerocd, runner]
    environment: {NEROCD_MODE: development}
    command: [--server, http://proxy:8081, --credential-file, /credentials/token, --journal-dir, /journal, --secret-root, /secrets/root, --id, runner_provenance, --tags, provenance-runtime, --capabilities, compose-deploy, --poll-interval, 1s, --work-dir, /workspace]
    user: "10001:10001"
    volumes: [runner-credential:/credentials:ro, runner-journal:/journal, runner-workspace:/workspace, runner-secrets:/secrets:ro]
    networks: [runtime]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 2s
volumes: {postgres-data: {}, runner-credential: {}, runner-journal: {}, runner-workspace: {}, runner-secrets: {}, git-data: {}}
networks: {runtime: {driver: bridge}}
