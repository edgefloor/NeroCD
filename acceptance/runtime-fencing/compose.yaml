services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: nerocd
      POSTGRES_USER: nerocd
      POSTGRES_PASSWORD: runtime_fencing_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerocd -d nerocd"]
      interval: 1s
      timeout: 1s
      retries: 30

  server:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEROCD_DATABASE_URL: postgres://nerocd:runtime_fencing_only@postgres:5432/nerocd?sslmode=disable
      NEROCD_REQUIRE_DATABASE: "true"
      NEROCD_LEASE_TTL: 10s
      NEROCD_REAPER_INTERVAL: 1s
    entrypoint: ["/bin/sh", "-ec"]
    command: ["nerocd migrate && nerocd seed-dev --seed-file /run/nerocd-dev-seed/dev.sql && exec nerocd server --addr :8080"]
    volumes:
      - ../../db/seeds/dev.sql:/run/nerocd-dev-seed/dev.sql:ro
    ports:
      - "127.0.0.1::8080"
    networks: [runtime]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "nerocd", "health", "--addr", "http://127.0.0.1:8080"]
      interval: 1s
      timeout: 2s
      retries: 30

  credential_init:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    user: "0:0"
    profiles: ["tools"]
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        IFS= read -r token_a
        IFS= read -r token_b
        test -n "$${token_a}" && test -n "$${token_b}"
        printf '%s\n' "$${token_a}" > /credentials-a/token
        printf '%s\n' "$${token_b}" > /credentials-b/token
        chmod 0600 /credentials-a/token /credentials-b/token
        chown 10001:10001 /credentials-a/token /credentials-b/token
        chmod 0700 /journal-a /journal-b
        chown 10001:10001 /journal-a /journal-b /state
    volumes:
      - runner-a-credential:/credentials-a
      - runner-b-credential:/credentials-b
      - runner-a-journal:/journal-a
      - runner-b-journal:/journal-b
      - fixture-state:/state

  runner_a:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/fixtures/runner-wrapper.sh", "runner-a"]
    environment:
      NEROCD_MODE: development
    command: ["nerocd", "runner", "--server", "http://server:8080", "--credential-file", "/credentials/token", "--journal-dir", "/journal", "--id", "runner_runtime_a", "--tags", "runtime-fencing", "--capabilities", "shell", "--poll-interval", "1s", "--cancel-poll-interval", "1s", "--work-dir", "/work"]
    read_only: true
    tmpfs: ["/tmp", "/work"]
    volumes:
      - runner-a-credential:/credentials:ro
      - runner-a-journal:/journal
      - fixture-state:/state
      - ./:/fixtures:ro
    networks: [runtime]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 2s

  runner_b:
    image: ${NEROCD_RUNTIME_IMAGE:?set NEROCD_RUNTIME_IMAGE}
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/fixtures/runner-wrapper.sh", "runner-b"]
    environment:
      NEROCD_MODE: development
    command: ["nerocd", "runner", "--server", "http://server:8080", "--credential-file", "/credentials/token", "--journal-dir", "/journal", "--id", "runner_runtime_b", "--tags", "runtime-fencing", "--capabilities", "shell", "--poll-interval", "1s", "--cancel-poll-interval", "1s", "--work-dir", "/work"]
    read_only: true
    tmpfs: ["/tmp", "/work"]
    volumes:
      - runner-b-credential:/credentials:ro
      - runner-b-journal:/journal
      - fixture-state:/state
      - ./:/fixtures:ro
    networks: [runtime]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 2s

volumes:
  postgres-data:
  runner-a-credential:
  runner-b-credential:
  runner-a-journal:
  runner-b-journal:
  fixture-state:

networks:
  runtime:
    driver: bridge
