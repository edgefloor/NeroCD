version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/store/sql
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: timestamptz
            nullable: false
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
